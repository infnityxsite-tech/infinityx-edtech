<body>
  <script>
    // FOUC prevention: apply theme before React hydration
    // Light mode is ALWAYS the default. Only use dark if user explicitly chose it.
    (function(){
      var manual = localStorage.getItem('infx-theme-manual') === 'true';
      var saved  = localStorage.getItem('infx-theme');
      var t = (manual && saved === 'dark') ? 'dark' : 'light';
      var r = document.documentElement;
      r.setAttribute('data-theme', t);
      r.classList.add(t === 'light' ? 'light-mode' : 'dark-mode');
      r.style.backgroundColor = t === 'dark' ? '#020617' : '#f0f4f8';
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
